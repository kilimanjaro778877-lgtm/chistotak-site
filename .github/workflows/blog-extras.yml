# Страховка для блог-агента: після кожної нової статті оновлює feed.xml і блок «Свіжі статті»
# на головній (tools/update_blog_extras.py). Якщо агент уже оновив — нічого не робить.
name: Blog extras

on:
  push:
    branches: [main]
    paths:
      - 'blog.html'
      - 'blog/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-extras
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Оновити feed.xml і «Свіжі статті»
        run: python3 tools/update_blog_extras.py

      - name: Закомітити, якщо щось змінилось
        id: commit
        run: |
          if git diff --quiet -- feed.xml index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Усе актуально"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml index.html
          git commit -m "chore: оновлено feed.xml і «Свіжі статті»"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Коміти від GITHUB_TOKEN самі не перезбирають GitHub Pages — просимо збірку явно
      - name: Перезібрати сайт
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
